name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows support is new and not verified yet; its results are informational.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Linux runners have Docker, so the container sandbox is tested there;
      # tests for a sandbox the runner lacks are skipped.
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run
