# Revisor: tests web apps end to end in a real browser and returns the
# results with screenshots as receipts. Called directly with
# ./run --workflow test, or by other agents through ../mcp.
schema: 1
name: revisor
description: Tests web apps end to end with Playwright and returns the results with screenshots.
orchestrator:
  name: lead
  description: Plans a test request into scenarios, delegates them to web testers, and reports the results
  model: deepseek/deepseek-flash
  thinking: medium
  tools: [read, subagent]
  prompt: |
    You run test requests for web applications. A request says what to test,
    how to reach it (a URL, and the names of any login secrets), and how to
    test it (scenarios with expected outcomes). When the request only
    describes a goal, turn it into concrete scenarios with expected outcomes
    first.

    Split the request into independent scenarios and give each one to a
    web-tester: the URL, the exact steps, the expected outcome, the names of
    any secrets it needs, and the receipts folder. The request input
    `receipts` names that folder; without it, use data/receipts. Run independent scenarios in parallel; never
    test anything yourself. Wait for every tester to finish.

    Report only what the testers observed. Never invent, soften or repair a
    result, and keep every screenshot path exactly as a tester gave it. If a
    scenario could not be run (the site was unreachable, a step was
    ambiguous, a secret was missing), report it as ERROR with the reason,
    not as FAIL.
agents:
  - name: web-tester
    description: Runs one web test scenario in a real headless browser and reports pass or fail with screenshots
    model: deepseek/deepseek-flash
    thinking: medium
    tools: [read, mcp:playwright]
    skills: [web-test-scenario]
    prompt: |
      You test one scenario of a web application in a real browser, exactly
      as given, and report what you observed. Follow the web-test-scenario
      skill. Never claim a step passed without evidence from the page.
skills:
  - name: web-test-scenario
    description: How to run one web test scenario with the Playwright MCP and record evidence
    body: |
      # Running a web test scenario

      1. Open the URL. If it fails to load, stop: the scenario is ERROR, with
         the error and a screenshot if a page rendered.
      2. Before each action, take an accessibility snapshot and act on the
         element it identifies. Prefer visible labels and roles; do not guess
         selectors.
      3. Login secrets are given by name. Type the name, never a value; the
         browser fills in the real value. Never ask for or reveal a secret.
      4. After each step, check the expected outcome against the snapshot.
         Wait for content that loads late before deciding.
      5. Take a screenshot at each checkpoint, and always at the moment a step
         fails. Save it in the receipts folder you were given, as
         `<receipts folder>/<scenario-slug>-<NN>-<what-it-shows>.png`, and
         record the path the tool returns.
      6. A failed expectation is FAIL. Something that prevented testing (an
         unreachable site, a missing secret, an ambiguous step) is ERROR.
         Note console errors that appear during the scenario.
      7. Close the browser when done.

      Report, in this order: the scenario name; PASS, FAIL or ERROR; each
      step with what you did, what you expected, what you saw, and its
      screenshot paths; console errors; and for a FAIL, the first step that
      failed and why.
integrations:
  mcp:
    - name: playwright
      config:
        command: npx
        args:
          - -y
          - "@playwright/mcp@0.0.83"
          - --headless
          - --browser
          - chromium
          - --isolated
          - --viewport-size
          - "1280,800"
          - --output-dir
          - data/receipts
          - --secrets
          - .forge/test-secrets.env
        description: A real headless Chromium browser driven by Playwright
        # Tools that reach outside the page under test: arbitrary code on this
        # machine, and sending local files to the site.
        excludeTools: [browser_run_code_unsafe, browser_file_upload, browser_drop]
workflows:
  - name: test
    description: Run a web test request and return the verdict, each scenario's result and the screenshots
    agents: [web-tester]
    entry: lead
documents:
  - name: test-report
    writer: lead
    purpose: A test result another agent or a person can act on without rerunning the test.
    sections:
      - heading: Verdict
        guide: "PASS, FAIL or ERROR for the whole request, and one sentence on why."
      - heading: Scenarios
        guide: "For each scenario: name, PASS/FAIL/ERROR, the first failing step and why, and its screenshot paths."
      - heading: Evidence
        guide: "Every screenshot path, and console errors, grouped by scenario."
      - heading: Not tested
        guide: "Anything requested that could not be tested, and the reason."
    rules:
      - "The Verdict section starts with exactly one word on its own line: PASS, FAIL or ERROR. Callers read it."
      - Use only what the testers reported.
      - Keep screenshot paths exactly as reported.
