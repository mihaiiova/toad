# Toad: tests web apps in a real browser, and command-line programs and HTTP
# APIs in a sandboxed shell, and returns the results with receipts
# (screenshots, recorded commands and requests). Called directly with
# ./run --approve -p "/skill:test <request>", or by other agents through ../mcp.
schema: 1
name: toad
description: Tests web apps, command-line programs and HTTP APIs end to end and
  returns the results with receipts.
orchestrator:
  name: lead
  description: Plans a test request into scenarios, delegates them to web, CLI and
    API testers, and reports the results
  model: deepseek/deepseek-flash
  thinking: medium
  tools:
    - subagent
    - read
    - ls
    - find
  prompt: |
    You run test requests for web applications, command-line programs and
    HTTP APIs. A request says what to test, how to reach it (a URL for a web
    app; a working folder, and how to invoke the program, for a CLI; a base
    URL, a working folder and maybe an OpenAPI description for an API; the
    names of any secrets), and how to test it (scenarios with expected
    outcomes). When the request only describes a goal, turn it into concrete
    scenarios with expected outcomes first.

    Split the request into scenarios and give each one to the right tester:
    web scenarios to a web-tester, command-line scenarios to a cli-tester,
    API scenarios to an api-tester. Give each the URL or working folder (an
    api-tester gets both: the URL to use from inside its sandbox, the
    working folder, and the OpenAPI description's path), the exact steps,
    the expected outcome, the names of any secrets it needs, and the
    receipts folder. The request input `receipts` names that folder; without
    it, use data/receipts. Run independent scenarios in parallel, but run CLI
    scenarios that change shared state (files, a database, a build) one at a
    time, and so do API scenarios that create, change or delete data another
    scenario relies on. Never test anything yourself; wait for every tester
    to finish. When you call the subagent tool, never set its `cwd`: testers
    only exist in this project. The program's working folder goes in the
    task text.

    Give each tester its own receipts folder, `<receipts folder>/<slug>`,
    where the slug is the scenario's name in lowercase with every run of
    other characters replaced by one hyphen (for example "Pi is available"
    becomes `pi-is-available`), and tell it to save every receipt there.
    Give each tester the scenario's name exactly as the request wrote it, and
    pass on what the request says about setup and installing prerequisites.
    When a scenario fails or errors because a program, package or module it
    needs is missing, say so as a missing prerequisite, apart from product
    failures.

    Report only what the testers observed. Never invent, soften or repair a
    result, and keep every receipt path (screenshots, command records)
    exactly as a tester gave it. If a scenario could not be run (the site or
    API was unreachable, the program was missing, a step was ambiguous, a
    secret was missing), report it as ERROR with the reason, not as FAIL.
agents:
  - name: web-tester
    description: Runs one web test scenario in a real headless browser and reports
      pass or fail with screenshots
    model: deepseek/deepseek-flash
    thinking: medium
    tools: [ mcp:playwright ]
    skills: [ web-test-scenario ]
    prompt: |
      You test one scenario of a web application in a real browser, exactly
      as given, and report what you observed. Follow the web-test-scenario
      skill. Never claim a step passed without evidence from the page.
  - name: cli-tester
    description: Runs one command-line test scenario and reports pass or fail with
      every command recorded as a receipt
    model: deepseek/deepseek-flash
    thinking: medium
    tools:
      [
        cli:prepare-scenario,
        cli:prepare-network-scenario,
        cli:run-command,
        cli:run-command-with-input,
        cli:run-structured-command
      ]
    skills: [ cli-test-scenario ]
    prompt: |
      You test one scenario of a command-line program, exactly as given, and
      report what you observed. Follow the cli-test-scenario skill. Never
      claim a step passed without evidence from a recorded command.
  - name: api-tester
    description: Runs one HTTP API test scenario and reports pass or fail with
      every request recorded as a receipt
    model: deepseek/deepseek-flash
    thinking: medium
    tools:
      [
        cli:prepare-scenario,
        cli:prepare-network-scenario,
        cli:run-command,
        cli:run-command-with-input,
        cli:run-structured-api
      ]
    skills: [ api-test-scenario ]
    prompt: |
      You test one scenario of an HTTP API, exactly as given, and report what
      you observed. Follow the api-test-scenario skill. Never claim a step
      passed without evidence from a recorded request.
skills:
  - name: web-test-scenario
    description: How to run one web test scenario with the Playwright MCP and record
      evidence
    body: |
      # Running a web test scenario

      1. Open the URL. If it fails to load, stop: the scenario is ERROR, with
         the error and a screenshot if a page rendered.
      2. Before each action, take an accessibility snapshot and act on the
         element it identifies. Prefer visible labels and roles; do not guess
         selectors.
      3. Login secrets are given by name. Type the name, never a value; the
         browser fills in the real value. Never ask for or reveal a secret.
      4. After each step, check the expected outcome against the snapshot.
         Wait for content that loads late before deciding.
      5. Take a screenshot at each checkpoint, and always at the moment a step
         fails. Save it as
         `<receipts folder>/<scenario-slug>/<NN>-<what-it-shows>.png`, numbering
         from 01, and record the path the tool returns. That folder holds this
         scenario's screenshots and console records and nothing else; never
         copy them elsewhere, including into the project under test.
      6. A failed expectation is FAIL. Something that prevented testing (an
         unreachable site, a missing secret, an ambiguous step) is ERROR.
         Note console errors that appear during the scenario.
      7. Close the browser when done.

      Evidence is kept apart from the report. The report cites each
      screenshot and console record by its absolute path and never inlines a
      screenshot, a page dump or a file's text.

      Return your report in the web-tester-report format declared in your
      instructions.
  - name: cli-test-scenario
    description: Run one CLI scenario and record its evidence
    body: |
      # Running a CLI test scenario

      1. Prepare a scenario for the requested project. If the scenario requires
         network access, use the network preparation tool with a non-mutating
         HTTP(S) endpoint. Otherwise use ordinary preparation. An infrastructure
         or preflight error is ERROR; do not run commands on the host instead.
      2. Use the returned scenario ID for every command in this scenario. The
         workspace persists across commands and is retained for inspection.
         Each command gets a fresh namespace; background servers do not persist.
      3. Check the program is available, then execute the scenario's steps in
         order. Put recorded evidence for one scenario under the supplied
         receipts folder, in a scenario-specific subfolder. Name each command
         NN-what-it-does, numbering from 01. Use the input-enabled command
         when needed. The workspace is scratch space, not evidence.
         Commands run with `/bin/sh`, not bash: use POSIX shell only (no
         `${PIPESTATUS[@]}`, `[[ ]]`, arrays or `source`), or run
         `bash -c '...'` when the image has bash.
      4. When one program invocation with explicit arguments covers every step and
         expected outcome of the scenario, use the structured command instead of a
         shell command: it asserts the exit code and stdout itself and, when the
         request says so, may record the scenario. Give it the scenario ID, the
         receipt name, the program and its arguments, and the expected exit code and
         stdout. Also pass the scenario's exact name and mark it complete only when
         that single action and assertion really cover the whole scenario; otherwise
         use the shell tools. It supports trusted, non-secret literal data only, so
         never use it for a scenario that needs credentials, and never weaken a
         scenario to make it recordable. Keep it the scenario's only receipt when
         recording.
      5. Compare recorded exit codes and output with the expected outcomes.
         A failed expectation is FAIL; missing dependencies, sandbox errors,
         missing secrets or ambiguous steps are ERROR. Do not infer success.
      6. If a step fails because a program, package or module it needs is
         missing ("command not found", "Cannot find module", "is not
         installed"), that is a missing prerequisite, not a product failure:
         record a command that shows it is missing and name it in the report.
         Install it only when the request says installing prerequisites is
         allowed, and then only inside the workspace or $HOME: the rest of
         the filesystem is read-only, so `npm install -g`, `apt-get` and
         `sudo` do not work. Use a local install (`npm install --no-save
         pkg@version`, `pip install --target .toad-deps pkg==version`) and
         put its bin folder first on PATH within the same command (for
         example `PATH="$PWD/node_modules/.bin:$PATH" tool --version`).
         Record the install and the retried step as receipts. If installing
         is not allowed, or the install fails, the step is ERROR.
      7. Secrets are referenced by environment variable name, never value.
         Return a scenario report with the verdict, observed steps and absolute
         receipt paths, without inlining receipt contents or logs. For FAIL,
         identify the first failing step and why.

  - name: api-test-scenario
    description: Run one HTTP API scenario and record every request as evidence
    body: |
      # Running an API test scenario

      1. Prepare a scenario with the network preparation tool, passing the API
         URL to use from inside the sandbox (the request says when it differs
         from the API's own URL). Any HTTP answer means the API is reachable;
         a preparation error is ERROR. Never send requests from the host.
      2. Use the returned scenario ID for every command. Commands run with
         `/bin/sh`, not bash: use POSIX shell only. The working folder,
         with the OpenAPI description and fixtures, is the current directory.
         When the request names an OpenAPI description, read the parts the
         scenario touches first (`grep`, `sed -n`, or `node -e` for JSON),
         and check status codes, content types and required fields against
         it.
      3. When recording is enabled and one credential-free request plus status/body
         assertion cover the entire scenario, use cli_run_structured_api with
         scenario, receipts, name, payload {method,url,headers,body,expect:{status,
         body:{equals:STRING or contains:STRING}}}, and capture {scenarioName,
         complete:true}. Only trusted non-secret fixtures and accept/content-type
         headers are supported; the sandbox needs Node with fetch. Never weaken
         a scenario to record it. Otherwise send one request per recorded command, numbered NN-what-it-does
         from 01, under the receipts folder in a scenario-specific subfolder:
         `curl -sS -i --max-time 30 -X METHOD "$URL/path"`, with
         `-H 'Content-Type: application/json' --data @body.json` or the
         input-enabled command for a body. `-i` keeps the status line and
         headers in the receipt. To check JSON, also save the body with
         `-o name.json` and test it in a following command with `node -e`
         and an exit code, never by reading alone.
      4. Secrets are environment variables, given by name. Use them only as
         "$NAME" inside the command (for example
         `-H "Authorization: Bearer $API_TOKEN"`); never echo, print or
         write them to a file. Toad redacts recorded values; do not search
         receipts or the workspace for secrets.
      5. Receipts are written outside the sandbox: commands cannot read or
         list them. Keep every receipt of this scenario in its own subfolder,
         named after the scenario, and send only the commands the scenario
         needs.
      6. Compare each response with the expected outcome: status code,
         required headers, body fields and values, and for error cases a
         4xx with a useful message, never a 5xx. A failed expectation is
         FAIL. An unreachable API, a missing secret, a missing tool the
         scenario needs (handle it as the cli-test-scenario skill describes,
         installing only when the request allows it) or an ambiguous step is
         ERROR. A 5xx where the scenario expected success is FAIL, with the
         response as evidence.
      7. Create only the data the scenario needs, and delete it afterwards
         when the API allows; say in Limits what was left behind.
      8. Return a scenario report with the verdict, each request with its
         status and what was checked, and absolute receipt paths, without
         inlining receipt contents. For FAIL, identify the first failing
         request and why.

integrations:
  cli:
    - name: prepare-scenario
      description: Copy the project into a persistent isolated scenario workspace and
        preflight the sandbox
      command: node
      args: [ tools/toad-exec.mjs, prepare, "{workdir}" ]
      approve: false
    - name: prepare-network-scenario
      description: Prepare a scenario and preflight connectivity to the specified
        HTTP(S) endpoint
      command: node
      args: [ tools/toad-exec.mjs, prepare, "{workdir}", "{url}" ]
      approve: false
    - name: run-command
      description: Run one shell command in a prepared scenario sandbox and record a receipt
      command: node
      args:
        [
          tools/toad-exec.mjs,
          run,
          "{receipts}",
          "{name}",
          "{scenario}",
          "{command}"
        ]
      approve: false
    - name: run-command-with-input
      description: Run one shell command in a prepared scenario sandbox with the given
        text as input, and record a receipt
      command: node
      args:
        [
          tools/toad-exec.mjs,
          run,
          "{receipts}",
          "{name}",
          "{scenario}",
          "{command}",
          "{input:file}"
        ]
      approve: false
    - name: run-structured-command
      description: Run one program with explicit arguments and assert its exit code
        and stdout, optionally recording the scenario when this one command covers it
      command: node
      args:
        [ tools/toad-structured-cli.mjs, "{request:file}" ]
      approve: false
    - name: run-structured-api
      description: Run a credential-free HTTP request with explicit status/body assertions
      command: node
      args: [ tools/toad-structured-api.mjs, "{request:file}" ]
      approve: false
  mcp:
    - name: playwright
      config:
        command: node
        args:
          - tools/playwright-mcp.mjs
          - -y
          - "@playwright/mcp@0.0.84"
          - --headless
          - --browser
          - chromium
          - --isolated
          - --viewport-size
          - "1280,800"
        description: A real headless Chromium browser driven by Playwright
        # Tools that reach outside the page under test: arbitrary code on this
        # machine, and sending local files to the site.
        excludeTools: [ browser_run_code_unsafe, browser_file_upload, browser_drop ]
workflows:
  - name: test
    description: Run a web, command-line or API test request and return the verdict,
      each scenario's result and the receipts
    agents: [ web-tester, cli-tester, api-tester ]
    entry: lead
documents:
  - name: test-report
    writer: lead
    purpose: A test result another agent or a person can act on without rerunning
      the test.
    sections:
      - heading: Results
        guide: "One line per requested scenario, in request order, exactly
          `- PASS | <scenario name>`, `- FAIL | <scenario name>` or
          `- ERROR | <scenario name>`, under a line that is exactly `Results:`."
      - heading: Verdict
        guide: One sentence on why the whole request passed, failed or could not be
          tested.
      - heading: Scenarios
        guide: "For each scenario: name, PASS/FAIL/ERROR, the first failing step and
          why, and its full absolute receipt paths."
      - heading: Evidence
        guide: Every receipt path (screenshots, command records) and console errors,
          grouped by scenario; each path written in full from /, exactly as the
          tester reported it.
      - heading: Not tested
        guide: Anything requested that could not be tested, and the reason.
    rules:
      - "The report's first line is exactly `Verdict: PASS`, `Verdict: FAIL` or
        `Verdict: ERROR`. Nothing comes before it: no greeting, progress note
        or summary. Callers read it."
      - "The second line is exactly `Results:`, followed by the result lines,
        before any other text. Callers read them."
      - Copy each scenario name character for character from the request. A
        request without named scenarios gets one result line named after its
        goal; scenarios you derived from a goal use the names you gave them.
      - Every requested scenario has exactly one result line. A scenario that
        was not run, was blocked or has no tester report is ERROR, never left
        out.
      - The verdict is FAIL if any result is FAIL, otherwise ERROR if any is
        ERROR, otherwise PASS.
      - Name every missing prerequisite (program, package or module) in Not
        tested, with the scenarios it blocked.
      - Use only what the testers reported.
      - Keep receipt paths exactly as reported.
      - Write every receipt, screenshot and artifact path as a full absolute
        path starting at /, inside the receipts folder the request named
        (for example <receipts folder>/<scenario>/<receipt>.txt); never a
        path relative to the project directory.
  - writer: web-tester
    purpose: One scenario's observed result and the evidence for it, in a shape the
      lead can assemble into the final report without opening any evidence file.
    sections:
      - heading: Scenario
        guide: The scenario name, and whether it was run as given, in one line.
      - heading: Result
        guide: "One word: PASS, FAIL or ERROR."
      - heading: Steps
        guide: "One row per step: what you did, what you expected, what you saw, and
          that step's evidence path."
      - heading: First failure
        guide: The earliest step that diverged and why it did, or 'none'.
      - heading: Evidence
        guide: Every screenshot and console record for this scenario, each as a full
          absolute path; console errors are listed here.
      - heading: Limits
        guide: What could not be tested, and why.
    rules:
      - Result is exactly one of PASS, FAIL or ERROR.
      - No step without an evidence path or an explicit 'no artifact'.
      - Cite evidence by absolute path; never inline a screenshot, a page dump
        or a file's text.
      - A step that could not run is ERROR with the reason, never FAIL.
      - Keep every path exactly as the tool returned it.
    name: web-tester-report
  - writer: cli-tester
    purpose: One scenario's observed result and the evidence for it, in a shape the
      lead can assemble into the final report without opening any evidence file.
    sections:
      - heading: Scenario
        guide: The scenario name, and whether it was run as written, in one line.
      - heading: Result
        guide: "One word: PASS, FAIL or ERROR."
      - heading: Steps
        guide: "One row per step: the command, what you expected, what you saw (exit
          code and the relevant output), and that step's receipt path."
      - heading: First failure
        guide: The earliest step that diverged and why it did, or 'none'.
      - heading: Evidence
        guide: Every command receipt for this scenario, each as a full absolute path,
          named as it was recorded.
      - heading: Limits
        guide: "What could not be tested, and why: prepare errors, missing secret,
          host-mode mismatches, and each missing prerequisite by name (program,
          package or module), with whether it was installed and retried."
    rules:
      - Result is exactly one of PASS, FAIL or ERROR.
      - No step without a receipt path or an explicit 'no artifact'.
      - Cite evidence by absolute path; never inline a receipt's contents or a
        log dump.
      - A non-zero exit code is a failure only when the scenario expected
        success.
      - Keep every path exactly as the recording tool returned it.
    name: cli-tester-report
  - writer: api-tester
    purpose: One scenario's observed result and the evidence for it, in a shape the
      lead can assemble into the final report without opening any evidence file.
    sections:
      - heading: Scenario
        guide: The scenario name, and whether it was run as written, in one line.
      - heading: Result
        guide: "One word: PASS, FAIL or ERROR."
      - heading: Steps
        guide: "One row per request: method and path, what you expected, what you
          saw (status and the relevant headers or fields), and that request's
          receipt path."
      - heading: First failure
        guide: The earliest request that diverged and why it did, or 'none'.
      - heading: Evidence
        guide: Every request receipt for this scenario, each as a full absolute path,
          named as it was recorded.
      - heading: Limits
        guide: What could not be tested, and why (naming any missing
          prerequisite), and any test data left behind.
    rules:
      - Result is exactly one of PASS, FAIL or ERROR.
      - No step without a receipt path or an explicit 'no artifact'.
      - Cite evidence by absolute path; never inline a receipt's contents, a
        response body dump or a secret.
      - A 4xx is a failure only when the scenario expected success.
      - Keep every path exactly as the recording tool returned it.
    name: api-tester-report
